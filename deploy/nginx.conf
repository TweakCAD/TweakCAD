# Standalone offline CAD editor — served at the domain root on :8080.
# The base http{} block from the image already `include`s mime.types, so we
# only override the server here (do NOT add a bare types{} block — it would
# replace the whole mime map).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation — required for SharedArrayBuffer, which the OCCT
    # wasm worker relies on. The Vite dev server sets the same COOP/COEP headers.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # WebAssembly: serve with the correct type + isolation + long cache.
    # All wasm (occt + planegcs) is hashed under /assets/, so `immutable` is
    # safe here; a regex location takes precedence over the /assets/ block.
    # (Caching is moot for this LAN/offline image anyway — it's a CDN-fronted
    # deployment that depends on the content hash.)
    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Hashed, immutable JS/CSS bundles.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback — every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
