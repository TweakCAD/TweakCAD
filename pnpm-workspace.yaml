# Single-project root: the CAD libraries are folded into ./lib and resolved
# via tsconfig paths + vite aliases, not as workspace packages.
packages:
  - '.'
# pnpm hardening.
strictPeerDependencies: true
autoInstallPeers: true
preferFrozenLockfile: true
verifyStoreIntegrity: true
resolutionMode: highest
# Transitive-dependency overrides. Every one is a build/test-time dependency
# pulled in deep by a plugin; none ships in the browser bundle. Each pins a
# patched version for an advisory the direct dependency can't reach — the
# direct vite is already 6.4.3, but vite-plugin-top-level-await and
# eslint-plugin-react-hooks drag their own older chains along.
overrides:
  # vite-plugin-top-level-await@1.6.0 pins uuid@10, which is vulnerable to
  # GHSA-w5hq-g745-h8pq (missing buffer bounds check). Force the patched line.
  uuid: 11.1.1
  # postcss <=8.5.22 (stringify XSS, and the incomplete fix that followed) —
  # via vite-plugin-top-level-await > vite > postcss.
  postcss: 8.5.31
  # nanoid <3.3.18 (non-secure generators loop on negative/zero size) — comes
  # in under postcss, which wants the 3.x line, so pin within it rather than
  # forcing nanoid 6 and breaking postcss.
  nanoid: 3.3.19
  # browserslist <=4.28.6 and the baseline-browser-mapping it pulls — via
  # eslint-plugin-react-hooks > @babel/core > @babel/helper-compilation-targets.
  browserslist: 4.29.4
  baseline-browser-mapping: 2.11.32
  # brace-expansion >=4.0.0 <5.0.12 — three DoS advisories (GHSA-6j4f-fj2g-mc7p
  # and GHSA-qhr7-859c-m2p7 recurse until the stack blows, GHSA-q2hr-2g5m-vwhr
  # is quadratic-time expansion). Arrives under eslint > minimatch.
  brace-expansion: 5.0.12
allowBuilds:
  '@swc/core': true
  esbuild: true
# pnpm 12 refuses packages younger than its built-in minimum release age — the
# window that lets a compromised publish be caught before anyone installs it.
# Each entry here is a deliberate waiver of that protection, so each one needs a
# reason and should be removed once the version ages past the window.
minimumReleaseAgeExclude:
  # The kernel is our own build of occt-wasm (TweakCAD/occt-wasm, branch
  # tweakcad: upstream 5.17.0 plus our face-merge fix), published 2026-11-09 by
  # the fork's release workflow with npm provenance and adopted the same day,
  # after its tarball passed our tests. Waiting adds nothing to that.
  # Drop this entry once it is no longer new.
  - '@tweakcad/occt-wasm@5.17.0-tweakcad.3'
