name: CI

# Pull requests, and pushes to main. A pull request's branch is checked once,
# as merged into main. A version tag runs these checks as the first job of
# image.yml, which builds the image only if they pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'The ref to check out; the triggering ref when empty'
        type: string
        required: false
        default: ''

# Read-only token, whatever the repository default is.
permissions:
  contents: read

# A second push to the same branch cancels the first: the WASM-heavy test
# job is slow enough that queued duplicates are worth dropping. The workflow
# name keeps the checks image.yml runs apart from the branch's own CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Runs the real planegcs and OCCT WASM modules out of node_modules —
      # no browser, no fixtures to fetch. Behaviour that is known-unbuilt is
      # marked `it.fails`, so anything red here is a real regression.
      - run: pnpm test:unit

      # `vite build` runs `tsc --noEmit` again first (see the `build`
      # script); kept last so a type or test failure reports sooner.
      - run: pnpm build

  # A gate like `ci`: any lint error or unformatted source fails the run. Warnings are reported
  # but don't fail it.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
