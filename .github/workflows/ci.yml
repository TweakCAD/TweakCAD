name: CI

on:
  push:
  pull_request:

# Read-only token, whatever the repository default is.
permissions:
  contents: read

# A second push to the same branch cancels the first: the WASM-heavy test
# job is slow enough that queued duplicates are worth dropping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Runs the real planegcs and OCCT WASM modules out of node_modules —
      # no browser, no fixtures to fetch. Behaviour that is known-unbuilt is
      # marked `it.fails`, so anything red here is a real regression.
      - run: pnpm test:unit

      # `vite build` runs `tsc --noEmit` again first (see the `build`
      # script); kept last so a type or test failure reports sooner.
      - run: pnpm build

  # A gate like `ci`: any lint error fails the run. Warnings are reported
  # but don't fail it.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
