name: Image

# A version tag runs the CI checks on the tag, then builds the container image
# and publishes it to the GitHub Container Registry as
# ghcr.io/tweakcad/tweakcad:<version> and :latest. Nothing is published unless
# the checks pass. Run by hand with a tag to publish one that was pushed before.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build, e.g. v0.2.1'
        required: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/tweakcad/tweakcad
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a version tag: $TAG" >&2; exit 1 ;;
          esac
      - name: Log in to ghcr.io
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - name: Build
        run: |
          docker build --target runner \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --tag "$IMAGE:${TAG#v}" --tag "$IMAGE:latest" .
      - name: Push
        run: |
          docker push "$IMAGE:${TAG#v}"
          docker push "$IMAGE:latest"
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
