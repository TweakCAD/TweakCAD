name: Feature request
description: Something the editor should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is pre-1.0 and a lot is deliberately unbuilt rather than
        forgotten — assemblies, remote compute, a plugin API, incremental
        rebuild. If your idea is one of those, say so and describe the
        workflow you need; that is more useful than the feature name.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to model?
      description: |
        The part or workflow, not the feature. "I need a hex pattern of
        counterbored holes on a curved face" tells us more than "add a
        pattern-on-surface tool", because it might already be possible a
        different way — or the right answer might be a different feature.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
      description: Workaround, other CAD package, or "give up".

  - type: textarea
    id: prior-art
    attributes:
      label: How do other tools handle it?
      description: |
        Fusion, FreeCAD, SolidWorks, Onshape — naming the equivalent tool
        and how its dialog behaves saves a lot of back and forth.
